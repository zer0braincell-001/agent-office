<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Kantor Agen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: kanvas 3D penuh layar; HUD mengambang di atas; panel bawah (HP) / panel kanan (desktop). */
:root{
  --bg:#e7ebf0; --scene:#dfe5ec; --panel:rgba(255,255,255,.88); --panel-solid:#ffffff;
  --fg:#18202b; --muted:#5b6676; --line:rgba(24,32,43,.12); --chip:#eef1f5;
  --accent:#3d5afe; --accent-fg:#ffffff;
  --be:#14a594; --fe:#e29317; --ds:#d9467f; --mg:#b8860b;
  --ok:#1f9d57; --warn:#c77700; --bad:#d23c3c;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --scene:#121922; --panel:rgba(22,29,39,.9); --panel-solid:#18202b;
  --fg:#e8edf3; --muted:#93a0b2; --line:rgba(232,237,243,.12); --chip:#222c39;
  --accent:#7c8cff; --accent-fg:#0f141b;
  --be:#3cc9b7; --fe:#f2b04a; --ds:#ee6fa0; --mg:#e0b54a;
  --ok:#4cc985; --warn:#f0a83a; --bad:#f06b6b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141b; --scene:#121922; --panel:rgba(22,29,39,.9); --panel-solid:#18202b;
  --fg:#e8edf3; --muted:#93a0b2; --line:rgba(232,237,243,.12); --chip:#222c39;
  --accent:#7c8cff; --accent-fg:#0f141b;
  --be:#3cc9b7; --fe:#f2b04a; --ds:#ee6fa0; --mg:#e0b54a;
  --ok:#4cc985; --warn:#f0a83a; --bad:#f06b6b; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.12)}

/* Bar atas */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:center;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;padding:8px 12px;border-radius:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--mg);display:inline-block;transform:rotate(45deg)}
.wstabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:2px}
.wstabs::-webkit-scrollbar{display:none}
.wstab{flex:none;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:500;font-size:13px;white-space:nowrap}
.wstab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wstab .pct{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--accent);animation:pulse 1.4s infinite}
.dot.done{background:var(--ok)}
.dot.plan{background:var(--mg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{flex:none;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px;line-height:1}

/* HUD proyek */
.hud{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));width:min(340px,calc(100% - 32px));border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.hud h1{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.hud .goal{color:var(--muted);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.pill.run{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.plan{background:color-mix(in srgb,var(--mg) 20%,transparent);color:var(--mg)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.stats{display:flex;gap:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats strong{color:var(--fg);font-weight:600}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* Panel */
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  max-height:62%;height:62%;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.min{height:auto}
.sheet.min .panes{display:none}
.handle{display:flex;justify-content:center;padding:8px 0 2px;border:0;background:none;width:100%}
.handle span{width:40px;height:4px;border-radius:9px;background:var(--line)}
.tabs{display:flex;gap:4px;padding:4px max(12px,env(safe-area-inset-left,0px)) 6px max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--chip);color:var(--fg)}
.tab .n{font-family:var(--f-mono);font-size:10.5px;margin-left:4px;color:var(--muted)}
.panes{flex:1;overflow-y:auto;min-height:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.briefmode{display:grid;gap:5px;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.briefmode[hidden]{display:none}
.briefmode:not([hidden])+.composer{border-top:0}
.composer textarea{flex:1;min-width:0;resize:none;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel-solid);padding:10px 12px;line-height:1.35}
.btn{border:0;border-radius:12px;padding:0 16px;height:42px;font-weight:600;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
@media (min-width:900px){
  .sheet,.sheet.min{left:auto;top:calc(62px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:390px;height:auto;max-height:none;border-radius:18px}
  .sheet.min .panes{display:block}
  .handle{display:none}
}

/* Isi panel */
.group{display:grid;gap:8px;margin-bottom:16px}
.group h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-solid);display:grid;gap:6px;text-align:left;width:100%;box-sizing:border-box}
button.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card .t{font-weight:600;font-size:13.5px;line-height:1.35}
.card .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.divtag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff}
.divtag.backend{background:var(--be)} .divtag.frontend{background:var(--fe)} .divtag.design{background:var(--ds)} .divtag.manager{background:var(--mg)}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:12px;border:1px dashed var(--line);border-radius:12px}
.log{display:grid;gap:2px}
.log div{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;line-height:1.45;padding:5px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-top:2px}
.log b{font-weight:600}
.agent{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.ava{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--f-display)}
.state{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:right}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-size:12px;font-weight:600}
.field input,.field select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel-solid);padding:0 10px;min-width:0;width:100%}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{font-size:12.5px;line-height:1.55;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}
.note strong{color:var(--fg)}
.keyrow{display:grid;grid-template-columns:90px 1fr auto;gap:6px}
.small{font-size:12px;color:var(--muted)}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:grid;place-items:end center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.modal{place-items:center}}
.modal .box{width:min(640px,100%);max-height:80vh;overflow:auto;border-radius:18px;background:var(--panel-solid);padding:18px;display:grid;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.modal h2{margin:0;font-family:var(--f-display);font-size:17px;text-wrap:balance}
.out{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--chip);border-radius:12px;padding:12px;overflow-wrap:anywhere}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));border-radius:12px;padding:9px 14px;font-size:13px;font-weight:500;max-width:calc(100% - 32px)}
@media (max-width:899px){.toast{top:auto;bottom:calc(64% + 8px)}}
.sel{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));width:min(260px,calc(100% - 32px));border-radius:var(--r);padding:12px;display:grid;gap:6px}
@media (min-width:900px){.sel{right:calc(420px + env(safe-area-inset-right,0px))}}
@media (max-width:899px){.sel{top:auto;bottom:calc(62% + 10px)} .hud{width:min(300px,calc(100% - 32px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<canvas id="c" tabindex="0" aria-label="Tampilan 3D kantor agen"></canvas>

<header class="top">
  <div class="brand glass"><i></i>Kantor Agen</div>
  <nav class="wstabs" id="wstabs" role="tablist" aria-label="Workspace"></nav>
  <button class="iconbtn glass" id="addWs" aria-label="Workspace baru" title="Workspace baru">+</button>
</header>

<section class="hud glass" id="hud" aria-live="polite"></section>
<section class="sel glass" id="sel" hidden></section>

<aside class="sheet glass" id="sheet">
  <button class="handle" id="handle" aria-label="Buka atau tutup panel"><span></span></button>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="tugas" aria-selected="true">Tugas<span class="n" id="nT"></span></button>
    <button class="tab" data-tab="log" aria-selected="false">Aktivitas</button>
    <button class="tab" data-tab="tim" aria-selected="false">Tim</button>
    <button class="tab" data-tab="set" aria-selected="false">Setelan</button>
  </div>
  <div class="panes" id="panes"></div>
  <div class="briefmode" id="briefmode" hidden>
    <div class="seg" role="group" aria-label="Cara mengerjakan brief"><button type="button" data-bmode="solo" aria-pressed="true">Solo</button><button type="button" data-bmode="tim" aria-pressed="false">Tim</button></div>
    <span class="small">Solo = 1 agen, paling hemat. Tim = dipecah manajer, lebih mahal, lihat usulan dulu.</span>
    <label class="small" style="display:flex;gap:8px;align-items:center">Batas biaya-setara $<input id="briefbatas" type="number" min="0" step="0.05" inputmode="decimal" placeholder="kosong = ikut config" aria-label="Batas biaya-setara workspace (USD), opsional" style="flex:1;min-width:0;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel-solid);padding:0 8px"></label>
  </div>
  <form class="composer" id="composer">
    <textarea id="brief" placeholder="Kasih brief ke Manajer, mis. &quot;Bikin landing page toko kue + form pesanan&quot;" aria-label="Brief untuk manajer"></textarea>
    <button class="btn" id="go" type="submit">Mulai</button>
  </form>
</aside>

<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
<div class="toast glass" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ====================== DATA & STATE ====================== */
const DIVS = {
  backend:{nama:'Backend', css:'--be', pos:[-8,1.6], aisle:[-10.7,-5.3]},
  frontend:{nama:'Frontend', css:'--fe', pos:[0,3.6], aisle:[-2.7,2.7]},
  design:{nama:'Desain', css:'--ds', pos:[8,1.6], aisle:[5.3,10.7]},
};
const DIV_KEYS = Object.keys(DIVS);
const NAMES = {backend:['Bima','Sekar','Tegar','Nadia'], frontend:['Dimas','Laras','Fajar','Citra'], design:['Ayu','Gilang','Rani','Yoga']};
const DESK_OFF = [[-1.3,-1.0],[1.3,-1.0],[-1.3,1.4],[1.3,1.4]];
const REPORT = [[-1.5,-5.6],[0,-5.3],[1.5,-5.6],[-2.8,-5.0],[2.8,-5.0],[-0.8,-4.7],[0.8,-4.7]];
const CORR_Z = -2.6;
const PRICE = {'claude-opus-5-5':[4,20],'claude-sonnet-5-5':[2,10],'claude-haiku-5-5':[0.1,0.5]};
const STORE = 'kantor-agen.v1';

const TEMPL = {
  backend:[['Rancang skema database','Tabel, relasi, dan indeks untuk {g}.'],['Bangun API endpoint utama','CRUD + validasi input untuk {g}.'],['Autentikasi & hak akses','Login, sesi, dan peran pengguna.'],['Uji API & dokumentasi','Tes otomatis dan dokumentasi endpoint.']],
  frontend:[['Kerangka halaman & routing','Struktur halaman utama {g}.'],['Komponen UI dari mockup','Tombol, kartu, form sesuai desain.'],['Sambungkan ke API','Ambil dan kirim data ke backend.'],['Responsif & aksesibilitas','Rapi di HP, fokus keyboard, kontras.']],
  design:[['Riset & moodboard','Referensi visual dan arah gaya {g}.'],['Wireframe alur utama','Alur pengguna dari awal sampai selesai.'],['Mockup final + palet','Warna, tipografi, dan layar final.'],['Ikon & aset','Ikon, ilustrasi, dan ekspor aset.']],
};
const DEPS = {frontend:{1:['design',2],2:['backend',1]}, backend:{}, design:{}};

const BR={on:false,pin:'',info:null,chat:null};
let S = load() || seed();
const RT = new Map();       // runtime per agen: posisi, path, mesh
let activeId = S.active;
let dirty = true;

function uid(){return Math.random().toString(36).slice(2,9)}
function now(){return Date.now()}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));return s&&s.ws?normalize(s):null}catch(e){return null}}
function save(){if(BR.on)return;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function normalize(s){
  s.ws.forEach(w=>{
    w.agents.forEach(a=>{a.state='idle';a.wait=0;});
    w.tasks.forEach(t=>{if(t.status==='kerja'||t.status==='lapor'){t.status='antre';t.agent=null;if(s.settings.mode==='api')t.progress=0;}});
    if(w.status==='planning'||w.status==='final'){w.status=w.tasks.length?'running':'idle';}
  });
  return s;
}
function mkAgents(per){
  const ag=[{id:'mgr',nama:'Arya',div:'manager',akun:0,state:'idle',selesai:0}];
  let k=0;
  DIV_KEYS.forEach(d=>{for(let i=0;i<per[d];i++){ag.push({id:d+i,nama:NAMES[d][i],div:d,slot:i,akun:(k++)%2,state:'idle',selesai:0});}});
  return ag;
}
function mkWs(nama,goal){return {id:uid(),nama,goal:goal||'',status:'idle',tasks:[],log:[],agents:mkAgents({backend:2,frontend:2,design:2}),biaya:0,ringkasan:'',contoh:false,t0:now()}}
function seed(){
  const a=mkWs('Toko Kue','Landing page toko kue + form pesanan online');a.contoh=true;
  const b=mkWs('App Absensi','Aplikasi absensi praktikum dengan QR');b.contoh=true;
  const s={v:1,active:a.id,ws:[a,b],settings:{mode:'sim',speed:2,keys:[{label:'Kunci A',key:''}],mgrModel:'claude-opus-5-5',wkModel:'claude-opus-5-5',hemat:false}};
  setTimeout(()=>{startBrief(a,a.goal,true);startBrief(b,b.goal,true);},600);
  return s;
}
function W(){return S.ws.find(w=>w.id===activeId)||S.ws[0]}
function agentOf(w,id){return w.agents.find(a=>a.id===id)}
function log(w,who,msg){w.log.unshift({t:now(),who,msg});if(w.log.length>200)w.log.length=200;dirty=true;}
function pct(w){if(!w.tasks.length)return w.status==='done'?100:0;const s=w.tasks.reduce((n,t)=>n+(t.status==='selesai'?1:t.status==='gagal'?1:(t.progress||0)*0.9),0);return Math.round(100*s/w.tasks.length)}

/* ====================== CLAUDE API ====================== */
const inflight = new Map();
async function callClaude({keyIdx=0,model,system,prompt,schema,effort='medium'}){
  const keys=S.settings.keys.filter(k=>k.key.trim());
  if(!keys.length) throw new Error('Belum ada API key. Isi di tab Setelan.');
  const k=keys[keyIdx%keys.length];
  while((inflight.get(k.key)||0)>=2) await new Promise(r=>setTimeout(r,400));
  inflight.set(k.key,(inflight.get(k.key)||0)+1);
  try{
    const body={model,max_tokens:16000,system,messages:[{role:'user',content:prompt}],output_config:{effort}};
    if(schema) body.output_config.format={type:'json_schema',schema};
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    if(j.stop_reason==='refusal') throw new Error('Model menolak tugas ini.');
    const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    const p=PRICE[model]||[4,20]; const u=j.usage||{};
    return {text,biaya:((u.input_tokens||0)*p[0]+(u.output_tokens||0)*p[1])/1e6};
  }catch(e){

function startBrief(w,goal,silent){

  if(!silent) toast('Manajer mulai menyusun rencana');

}
function addTasks(w,list){
  const ids=list.map(()=>uid());
  list.forEach((t,i)=>w.tasks.push({id:ids[i],div:t.div,title:t.title,detail:t.detail,status:'antre',agent:null,progress:0,dur:t.dur||12,after:(t.after||[]).map(j=>ids[j]).filter(Boolean),revisi:0,coba:0,output:''}));

function planSim(w){
  const list=[],idx={};
  DIV_KEYS.forEach(d=>{idx[d]=[];TEMPL[d].forEach(([title,detail],i)=>{idx[d][i]=list.length;list.push({div:d,title,detail:detail.replace('{g}',w.nama.toLowerCase()),dur:9+Math.random()*12});});});
  list.forEach(t=>{});
  Object.entries(DEPS).forEach(([d,m])=>Object.entries(m).forEach(([i,[d2,j]])=>{list[idx[d][i]].after=[idx[d2][j]];}));
  // tugas desain pertama dulu, tugas lain di divisi sama berurutan
  DIV_KEYS.forEach(d=>idx[d].forEach((li,i)=>{if(i>1){list[li].after=(list[li].after||[]).concat([idx[d][i-2]]);}}));
  addTasks(w,list);
  w.ringkasan='Proyek dipecah jadi '+list.length+' tugas: desain menyiapkan arah visual, backend menyiapkan data & API, frontend merangkai keduanya.';
  log(w,'Arya','Rencana siap: '+list.length+' tugas dibagi ke 3 divisi.');

async function planApi(w){

      prompt:'Nama proyek: '+w.nama+'\nBrief: '+w.goal+'\nTim: '+per});
    w.biaya+=r.biaya;
    const j=JSON.parse(r.text.slice(r.text.indexOf('{'),r.text.lastIndexOf('}')+1));

      prompt:'Proyek: '+w.nama+'\nBrief: '+w.goal+'\nRencana manajer: '+w.ringkasan+'\n\nTugasmu: '+t.title+'\n'+t.detail+(deps?'\n\nHasil tim yang kamu butuhkan:\n'+deps:'')+(t.catatan?'\n\nCatatan revisi dari manajer: '+t.catatan:'')});

function depsOk(w,t){return t.after.every(id=>{const x=w.tasks.find(y=>y.id===id);return !x||x.status==='selesai'||x.status==='gagal'})}

function tickWs(w,dt){
  const sim=S.settings.mode!=='api';
  const m=agentOf(w,'mgr');
  if(w.status==='planning'&&sim){w.planT-=dt;if(w.planT<=0)planSim(w);}
  if(w.status!=='running')return;
  for(const a of w.agents){
    if(a.div==='manager')continue;
    const rt=getRT(w,a);
    if(a.state==='idle'||a.state==='santai'){
      const t=w.tasks.find(t=>(t.status==='antre'||t.status==='revisi')&&t.div===a.div&&(!t.agent||t.agent===a.id)&&depsOk(w,t));
      if(t&&a.state==='idle'&&!rt.moving){
        t.status='kerja';t.agent=a.id;a.task=t.id;a.state='kerja';
        log(w,a.nama,(t.revisi?'Merevisi':'Mulai mengerjakan')+' "'+t.title+'".');
        if(!sim){t.progress=0;workApi(w,a,t);}
        dirty=true;
      }else if(!t&&a.state==='idle'&&!rt.moving){
        a.wait=(a.wait||0)+dt;
        if(a.wait>9+Math.random()*30){a.wait=0;a.state='santai';goPantry(w,a);}
      }
    }else if(a.state==='kerja'){
      const t=w.tasks.find(x=>x.id===a.task); if(!t){a.state='idle';continue;}
      if(rt.moving)continue;
      if(sim){t.progress=Math.min(1,t.progress+dt/t.dur);}
      else if(t.progress<1){t.progress=Math.min(.92,t.progress+dt*(0.92-t.progress)/20);}
      if(t.progress>=1&&t.status==='kerja'){
        if(sim)t.output=SIM_OUT[t.div](t);
        t.status='lapor';a.state='lapor';goReport(w,a);
        log(w,a.nama,'Selesai "'+t.title+'", menyerahkan ke Manajer.');
      }
    }else if(a.state==='lapor'&&!rt.moving&&rt.at==='report'){
      a.rev=(a.rev||0)+dt;
      if(m.state!=='review'&&m.state!=='rangkum')m.state='review';
      if(a.rev>2.6){
        a.rev=0;const t=w.tasks.find(x=>x.id===a.task);
        const tolak=sim&&t.revisi===0&&Math.random()<.18;
        if(tolak){t.status='revisi';t.revisi++;t.progress=.55;t.catatan='Perlu dirapikan lagi.';log(w,'Arya','Minta revisi "'+t.title+'" ke '+a.nama+'.');a.state='kerja-kembali';}
        else{t.status='selesai';a.selesai++;log(w,'Arya','Menyetujui "'+t.title+'".');a.state='kembali';}
        goDesk(w,a);
        if(!w.agents.some(x=>x.state==='lapor'))m.state='idle';
        dirty=true;
      }
    }else if((a.state==='kembali'||a.state==='kerja-kembali')&&!rt.moving){
      if(a.state==='kerja-kembali'){const t=w.tasks.find(x=>x.id===a.task);a.state='kerja';t.status='kerja';}
      else{a.state='idle';a.task=null;}
    }else if(a.state==='santai'&&!rt.moving){}
  }
  if(w.tasks.length&&w.tasks.every(t=>t.status==='selesai'||t.status==='gagal')&&w.agents.every(a=>a.div==='manager'||(a.state!=='lapor'))){
    if(w.status==='running'){
      w.status='final';m.state='rangkum';log(w,'Arya','Semua tugas masuk. Menyusun laporan akhir.');
      if(sim){setTimeout(()=>{w.laporan='Laporan (simulasi) proyek '+w.nama+':\n\n'+w.tasks.map(t=>'- ['+DIVS[t.div].nama+'] '+t.title+' oleh '+((agentOf(w,t.agent)||{}).nama||'-')+(t.revisi?' (1x revisi)':'')).join('\n')+'\n\nNyalakan mode API untuk laporan dan hasil kerja sungguhan dari Claude.';finishWs(w);},3000/S.settings.speed);}
      else finalApi(w);
    }
  }
}

const HASIL={};// wsId -> {files,folder,err,at,p}
function muatHasil(w,force){

  if(c.p)return c.p;

    .finally(()=>{c.at=Date.now();c.p=null;dirty=true;}).then(()=>c);

function linkify(w,text){
  const s=esc(text);if(!BR.on)return s;
  const files=(HASIL[w.id]&&HASIL[w.id].files)||[];
  const cari=n=>{n=n.replace(/&amp;/g,'&').replace(/\\/g,'/').replace(/^\.\//,'');
    const exact=files.find(f=>f.path===n);if(exact)return exact;
    const base=files.filter(f=>f.path.split('/').pop()===n.split('/').pop());return base.length===1?base[0]:null;};
  return s.replace(/`([^`\n]+)`|\bhttps?:\/\/(?:(?!&quot;|&lt;|&gt;)[^\s<>"'`])+/g,(m,code)=>{
    if(code!=null){const f=cari(code);return f?'<a href="'+esc(hasilUrl(w,f.path))+'" target="_blank" rel="noopener noreferrer">`'+code+'`</a>':m;}
    const url=m.replace(/[.,;:!?)\]]+$/,''),tail=m.slice(url.length);

  }

  }
  else if(d.mode){S.settings.mode=d.mode;dirty=true;}
  else if(d.speed){S.settings.speed=+d.speed;dirty=true;}
  else if(d.hemat){S.settings.hemat=d.hemat==='1';resize();dirty=true;}
  else if(d.kadd!=null){S.settings.keys.push({label:'Kunci '+String.fromCharCode(65+S.settings.keys.length),key:''});dirty=true;}
  else if(d.kdel){S.settings.keys.splice(+d.kdel,1);dirty=true;}
  else if(d.copy){const t=w.tasks.find(x=>x.id===d.copy);try{await navigator.clipboard.writeText(t.output);toast('Hasil disalin');}catch(_){toast('Gagal menyalin; pilih teksnya manual.',true);}}
  else if(d.retry){const t=w.tasks.find(x=>x.id===d.retry);t.status='antre';t.coba=0;t.agent=null;if(w.status==='done')w.status='running';$('modal').hidden=true;dirty=true;}

  else if(d.act==='del-ok'){S.ws=S.ws.filter(x=>x!==w);activeId=S.active=S.ws[0].id;built=null;$('modal').hidden=true;dirty=true;}

  else if(d.act==='reset-ok'){try{localStorage.removeItem(STORE)}catch(_){}RT.clear();S=seed();activeId=S.active;built=null;$('modal').hidden=true;dirty=true;}
  else if(d.act==='new-ok'){const n=$('nw').value.trim()||('Proyek '+(S.ws.length+1));const x=mkWs(n,'');S.ws.push(x);activeId=S.active=x.id;built=null;$('modal').hidden=true;dirty=true;setTimeout(()=>$('brief').focus(),50);}
});

async function api(p,body){

  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
}
function applyServer(data){
  if(!data||!Array.isArray(data.ws))return;

  S.ws=data.ws;
  if(!S.ws.find(w=>w.id===activeId))activeId=S.active=(S.ws[0]||{}).id;
  S.ws.forEach(w=>w.agents.forEach(a=>{
    const was=old.get(w.id+':'+a.id);if(was===undefined||was===a.state||a.div==='manager')return;
    if(a.state==='lapor')goReport(w,a);else if(was==='lapor')goDesk(w,a);
  }));
  dirty=true;
}
async function tryBridge(){
  if(!/^https?:$/.test(location.protocol))return;
  const q=new URLSearchParams(location.search).get('pin');
  if(q){try{localStorage.setItem('kantor-agen.pin',q)}catch(_){}history.replaceState(null,'',location.pathname);}
  if(!BR.pin){try{BR.pin=q||localStorage.getItem('kantor-agen.pin')||''}catch(_){BR.pin=q||''}}
  let d;try{d=await api('state');}catch(e){
    if(/PIN/.test(e.message))openModal('<h2>Masukkan PIN kantor</h2><div class="small">PIN tercetak di jendela server saat dijalankan, dan tersimpan di config.json.</div><div class="field"><input id="pin" inputmode="numeric" autocomplete="off"></div><div class="row"><button class="btn sm" data-act="pin-ok">Sambungkan</button></div>');
    return;}
  if(!d||!Array.isArray(d.ws))return;
  BR.on=true;RT.clear();built=null;S.selected=null;S.ws=[];applyServer(d);renderBriefMode();
  if(!S.ws.length)api('ws',{nama:'Proyek Pertama'}).catch(()=>{});
  const es=new EventSource('/api/events?pin='+encodeURIComponent(BR.pin));
  es.onmessage=ev=>{try{applyServer(JSON.parse(ev.data))}catch(_){}};
  es.onerror=()=>toast('Koneksi ke laptop terputus. Mencoba lagi…',true);
  document.querySelector('.brand').lastChild.textContent='Kantor Agen · Laptop';
  toast('Tersambung ke server di laptop');
}
function openChat(id){
  if(!BR.on){openModal('<h2>Chat butuh mode Laptop</h2><div class="small">Chat langsung ke agen jalan kalau kantor dibuka dari server di laptopmu, karena agennya dijalankan Claude Code di sana.</div><div class="row"><button class="btn sm" data-close>Oke</button></div>');return;}
  BR.chat=id;openModal('<div id="chatbox"></div><div class="row" style="flex-wrap:nowrap"><textarea id="chatin" style="flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel-solid);padding:10px 12px;resize:none" placeholder="Tulis pesan. Awali dengan &quot;ingat:&quot; untuk menyimpan ke memori agen."></textarea><button class="btn" data-act="chat-kirim">Kirim</button></div><div class="row"><button class="btn ghost sm" data-close>Tutup</button></div>');
  renderChat();setTimeout(()=>{const i=$('chatin');i&&i.focus();i&&i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});},30);
}
function renderChat(){
  const box=$('chatbox');if(!box)return;const a=agentOf(W(),BR.chat);if(!a)return;
  const sig=(a.chat||[]).length+a.state;if(box.dataset.sig===sig)return;box.dataset.sig=sig;
  box.innerHTML='<h2>Chat · '+esc(a.nama)+'</h2><div class="small">'+esc(a.aktivitas||STATE_TXT[a.state]||'')+'</div><div style="display:grid;gap:8px;margin-top:8px">'+((a.chat||[]).map(m=>'<div class="out" style="'+(m.dari==='kamu'?'background:color-mix(in srgb,var(--accent) 16%,var(--chip));justify-self:end;max-width:85%':'max-width:92%')+'"><b>'+esc(m.dari==='kamu'?'Kamu':m.dari)+'</b>\n'+esc(m.teks)+'</div>').join('')||'<div class="empty">Belum ada obrolan. Pesan ke agen memakai kuota akun Claude yang sama.</div>')+'</div>';
  box.parentElement.scrollTop=box.parentElement.scrollHeight;
}
function sendChat(){const i=$('chatin');const m=i&&i.value.trim();if(!m)return;i.value='';api('ws/'+W().id+'/chat',{agent:BR.chat,pesan:m}).catch(e=>toast(e.message,true));}
tryBridge();

/* ====================== LOOP ====================== */
applyTheme();buildStatic();resize();
const mq=matchMedia('(prefers-color-scheme: dark)');
const retheme=()=>{applyTheme();built=null;};
mq.addEventListener&&mq.addEventListener('change',retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let last=performance.now(),uiT=0,saveT=0;
function frame(t){
  const raw=Math.min(.1,(t-last)/1000);last=t;const dt=raw*S.settings.speed;
  syncScene();
  S.ws.forEach(w=>{if(!BR.on)tickWs(w,dt);w.agents.forEach(a=>animAgent(w,a,dt,w.id===activeId));});
  updateCam(raw);
  uiT+=raw;saveT+=raw;
  if(uiT>.5||dirty){uiT=0;renderTabs();renderHud();drawScreen(W());if(dirty||tab==='tugas'||tab==='tim'){if(!document.activeElement||!document.activeElement.closest('#panes'))renderPane();}renderSel();if(BR.chat&&!$('modal').hidden)renderChat();dirty=false;}
  if(saveT>2){saveT=0;save();}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
